name: "Sync BDIX Index"

'on':
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  build-and-deploy-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Mihomo BDIX Proxy Core
        run: |
          echo "[Setup] Downloading Mihomo Linux x64 core..."
          curl -sSL https://github.com/MetaCubeX/mihomo/releases/download/v1.19.16/mihomo-linux-amd64-v1.19.16.gz -o mihomo.gz
          gunzip mihomo.gz
          chmod +x mihomo
          
          echo "[Setup] Starting Mihomo daemon with BDIX proxies on port 7890..."
          ./mihomo -d . -f config.yaml > mihomo.log 2>&1 &
          
          sleep 4
          cat mihomo.log || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Execute CircleFTP Scraper and ML Vector Compiler"
        run: |
          python crawler.py --outdir dist
        env:
          PYTHONUNBUFFERED: '1'

      - name: "Execute MovieBox Scraper and ML Vector Compiler"
        run: |
          python moviebox_indexer.py --outdir dist
        env:
          PYTHONUNBUFFERED: '1'

      - name: Show Artifact Summary
        run: |
          ls -lh dist/
          cat dist/manifest.json || true

      - name: "Publish to GitHub Releases"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The release always exists (created once); retry upload up to 5 times
          # to ride out transient GitHub API 5xx errors on asset replacement.
          for i in 1 2 3 4 5; do
            if gh release upload latest dist/* --clobber; then
              echo "[Publish] Assets uploaded (attempt $i)."
              exit 0
            fi
            echo "[Publish] Upload attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "[Publish] All retry attempts exhausted. Creating release as last resort."
          gh release create latest dist/* \
            --title "Fensy Catalogs & Embeddings (Automated Sync)" \
            --notes "Automated 6-hour sync of CircleFTP and MovieBox media databases with 64-dim ML embeddings."
