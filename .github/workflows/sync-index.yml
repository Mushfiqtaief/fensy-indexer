name: "Sync BDIX Index"

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Mihomo BDIX Proxy Core
        run: |
          echo "[Setup] Downloading Mihomo Linux x64 core..."
          curl -sSL https://github.com/MetaCubeX/mihomo/releases/download/v1.19.16/mihomo-linux-amd64-v1.19.16.gz -o mihomo.gz
          gunzip mihomo.gz
          chmod +x mihomo
          
          echo "[Setup] Starting Mihomo daemon with BDIX proxies on port 7890..."
          ./mihomo -d . -f config.yaml > mihomo.log 2>&1 &
          
          sleep 4
          cat mihomo.log || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Scraper & ML Vector Compiler
        run: |
          python crawler.py --outdir dist
        env:
          PYTHONUNBUFFERED: '1'

      - name: Show Artifact Summary
        run: |
          ls -lh dist/
          cat dist/manifest.json

      - name: Publish to GitHub Releases (Tag: latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest dist/* \
            --title "CircleFTP Index & Embeddings (Automated Sync)" \
            --notes "Automated daily sync of CircleFTP media database and 64-dim ML embeddings." \
            --clobber
